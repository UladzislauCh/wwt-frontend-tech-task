name: Pipeline

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version is taken from the "packageManager" field in package.json
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fast checks first, so the job fails early
      - name: Check format
        run: pnpm format:check:all

      - name: Run lint
        run: pnpm lint:all

      - name: Run tests
        run: pnpm vitest run

      # Includes type checking (tsc)
      - name: Run build
        run: pnpm build
